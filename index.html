<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entanglement · Friday</title>
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friday">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#0d0d0f;--fg:#e7e6e2;--dim:#8d8d92;--line:rgba(231,230,226,.16);
 --hi:#e7e6e2;--pill:rgba(231,230,226,.1)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);
 font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.ini{font-family:Georgia,"Times New Roman",serif;font-weight:400}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
header{padding:18px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:27px;font-weight:300;letter-spacing:.01em;line-height:1}
h1 .f{font-family:Georgia,serif;font-size:11px;vertical-align:super;color:var(--dim);margin-left:5px}
.sub{font-size:12.5px;color:var(--dim);margin-top:5px;letter-spacing:.02em}
.clock{float:right;font-size:12.5px;color:var(--dim);letter-spacing:.04em;padding-top:5px}

.card{border:1px solid var(--line);border-radius:14px;padding:15px 15px 14px;margin-bottom:12px;
 background:rgba(231,230,226,.035)}
.card.now{border-color:var(--fg);background:rgba(231,230,226,.09)}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
 margin-bottom:7px}
.card.now .eyebrow{color:var(--fg)}
.name{font-size:26px;font-weight:300;letter-spacing:-.01em;line-height:1.1}
.name sup{font-size:11px;color:var(--dim);vertical-align:super;margin-left:5px;letter-spacing:.04em}
.meta{font-size:14px;color:var(--dim);margin-top:5px}
.bar{height:3px;background:rgba(231,230,226,.16);border-radius:2px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.left{font-size:12.5px;color:var(--dim);margin-top:6px}
.big{font-size:38px;font-weight:300;line-height:1.05;letter-spacing:-.02em}
.tiny{font-size:13.5px;color:var(--dim);margin-top:8px;line-height:1.45}

.sec{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
 margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);
 align-items:flex-start;cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:0 0 74px;font-size:13px;color:var(--dim);padding-top:3px;letter-spacing:.01em}
.row .b{flex:1;min-width:0}
.row .n{font-size:19px;font-weight:300;line-height:1.2}
.row .n sup{font-size:10px;color:var(--dim);vertical-align:super;margin-left:4px}
.row .r{font-size:12.5px;color:var(--dim);margin-top:3px}
.row .w{font-size:14px;color:var(--fg);opacity:.82;margin-top:6px;line-height:1.42}
.row.on{border-left:2px solid var(--fg);padding-left:11px;margin-left:-13px}
.row.past{opacity:.38}
.row.step .n{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row.step .w{opacity:.7}
.pill{display:inline-block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
 background:var(--fg);color:var(--bg);padding:3px 7px;border-radius:4px;margin-left:7px;
 vertical-align:2px}
.dimroom{opacity:.5}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(13,13,15,.93);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 border-top:1px solid var(--line);display:flex;
 padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:11px;
 letter-spacing:.12em;text-transform:uppercase;padding:7px 0;cursor:pointer}
nav button.on{color:var(--fg)}

.sheet{position:fixed;inset:0;background:rgba(13,13,15,.72);
 backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 display:none;align-items:flex-end;z-index:100}
.sheet.open{display:flex}
.sheetin{background:#151517;border-top-left-radius:20px;border-top-right-radius:20px;
 width:100%;max-height:84vh;overflow:auto;padding:22px 20px calc(30px + env(safe-area-inset-bottom));
 border-top:1px solid var(--line)}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(231,230,226,.3);
 margin:0 auto 16px}
.sheetin h2{font-size:27px;font-weight:300;line-height:1.1}
.sheetin .m2{font-size:13.5px;color:var(--dim);margin-top:7px;padding-bottom:14px;
 border-bottom:1px solid var(--line)}
.sheetin p{font-size:16px;line-height:1.5;margin-top:14px;opacity:.92}
.sheetin .src{font-size:11.5px;color:var(--dim);margin-top:18px;letter-spacing:.02em}
.hide{display:none}
a{color:var(--fg)}
.info p{font-size:15.5px;line-height:1.5;margin-bottom:12px}
.info b{font-weight:400;border-bottom:1px solid var(--line)}
.install{border:1px dashed var(--line);border-radius:12px;padding:13px 14px;margin-top:16px;
 font-size:14px;color:var(--dim);line-height:1.5}
</style></head><body>

<div class="wrap">
 <header>
  <span class="clock" id="clock"></span>
  <h1><span class="ini">E</span>ntanglement<span class="f">(Friday)</span></h1>
  <div class="sub">18 September 2026 · The Loom, Oakland · 10:00 PM – 6:00 AM</div>
 </header>

 <div id="v-now"></div>
 <div id="v-plan" class="hide"></div>
 <div id="v-all" class="hide"></div>
 <div id="v-info" class="hide info"></div>
</div>

<nav>
 <button data-v="now" class="on">Now</button>
 <button data-v="plan">Plan</button>
 <button data-v="all">All rooms</button>
 <button data-v="info">Info</button>
</nav>

<div class="sheet" id="sheet"><div class="sheetin">
 <div class="grab"></div>
 <h2 id="sh-n"></h2><div class="m2" id="sh-m"></div>
 <p id="sh-b"></p>
 <div class="src">Biography as published by the festival.</div>
</div></div>

<script>
const DATA = {"slots":[{"room":"Geist","a":"Kudeki","sup":null,"tag":null,"s":"2026-09-19T05:00:00Z","e":"2026-09-19T06:30:00Z","sm":1320,"em":1410,"bio":"Endzeit resident, now Berlin-based, with a release on Martyn's 3024 behind her. Techno with acid nerve and industrial edges.","route":true,"why":"Start here. Acid-edged but patient while the room fills.","note":"the loud room"},{"room":"Geist","a":"Haruka","sup":null,"tag":"bay area debut","s":"2026-09-19T06:30:00Z","e":"2026-09-19T08:00:00Z","sm":1410,"em":1500,"bio":"A longtime resident of DJ Nobu’s Future Terror and head of the Protection label, Haruka left a mark in Detroit, having played with Craig Gonzalez for Interdimensional Transmissions in 2025. The Tokyo selector debuts in the Bay Area for Entanglement.","route":true,"why":"Deep and psychedelic, not hard. The easiest listening on the bill.","note":"the loud room"},{"room":"Geist","a":"Agonis","sup":"live","tag":null,"s":"2026-09-19T08:00:00Z","e":"2026-09-19T09:00:00Z","sm":1500,"em":1560,"bio":"Co-founder of Amenthia Recordings, the Basel label that has spent ten years defining a nonlinear psychedelia of its own. He returns to Endzeit following his acclaimed live set at SF Art Week in January, bringing an immersive performance that challenges genres and boundaries.","route":true,"why":"Back to Geist. Live, immersive, melodic rather than forceful. The high point of the night.","note":"the loud room"},{"room":"Geist","a":"DJ MARIA.","sup":null,"tag":null,"s":"2026-09-19T09:00:00Z","e":"2026-09-19T11:00:00Z","sm":1560,"em":1680,"bio":"Osaka-born, Tokyo-based, and among the clearest voices in Japan's new generation of psychedelic techno. Maria helps run the beloved forest festivals Moment and Transcendance; she returns to Endzeit following her acclaimed performance during Endzeit x SF Art Week.","route":true,"why":"Two hours to dance. Trance-leaning and patiently paced.","note":"the loud room"},{"room":"Geist","a":"Garçon","sup":null,"tag":"west coast debut","s":"2026-09-19T11:00:00Z","e":"2026-09-19T13:00:00Z","sm":1680,"em":1800,"bio":"Co-founder of Amenthia Recordings, making his West Coast debut. Running the label and selecting records have been the same faculty for him for a decade, and the Amenthia ten-year retrospective closes with his tasteful continuous mix.","route":true,"why":"Warm and unbroken to close.","note":"the loud room"},{"room":"Interdimensional Transmissions","a":"Nick Moss","sup":null,"tag":null,"s":"2026-09-19T05:00:00Z","e":"2026-09-19T07:00:00Z","sm":1320,"em":1440,"bio":"California-born and -based. Formerly of the San Francisco queer collective Kosmetik and its long Stud residency; now behind the open-air party Quiche.","route":false,"why":null,"note":"darkest and hardest"},{"room":"Interdimensional Transmissions","a":"Mozhgan","sup":null,"tag":null,"s":"2026-09-19T07:00:00Z","e":"2026-09-19T09:00:00Z","sm":1440,"em":1560,"bio":"Iranian-born, California-based, founder of We Are Monsters. A No Way Back and Endzeit regular, she embodies the spirit of both collectives like few others.","route":false,"why":null,"note":"darkest and hardest"},{"room":"Interdimensional Transmissions","a":"Carlos Souffront","sup":null,"tag":null,"s":"2026-09-19T09:00:00Z","e":"2026-09-19T11:00:00Z","sm":1560,"em":1680,"bio":"A DJ's DJ out of the Detroit area, now a San Francisco treasure. Present when the first No Way Back passed the twelve-hour mark, and every mutation since.","route":false,"why":null,"note":"darkest and hardest"},{"room":"Interdimensional Transmissions","a":"Erika","sup":null,"tag":null,"s":"2026-09-19T11:00:00Z","e":"2026-09-19T13:00:00Z","sm":1680,"em":1800,"bio":"Partner in Interdimensional Transmissions and one half of Ectomorph. Handed a TR-606 in 1997 by BMG; three decades of music and machines since, split between Detroit and Berlin, dreaming on the cellular level.","route":false,"why":null,"note":"darkest and hardest"},{"room":"Sanctuary","a":"Torsion","sup":"live","tag":null,"s":"2026-09-19T07:00:00Z","e":"2026-09-19T08:00:00Z","sm":1440,"em":1500,"bio":"Endzeit residents, Torsion will perform a live ambient set drawing inspiration from the meditative sonic explorations of Soundworks.","route":true,"why":"Move to the quiet room. No beat, low volume — a completely different kind of hour.","note":"quiet · live ambient"},{"room":"Sanctuary","a":"Raica","sup":"live","tag":null,"s":"2026-09-19T08:00:00Z","e":"2026-09-19T09:30:00Z","sm":1500,"em":1590,"bio":"Long-form composition and spatial sound from Seattle’s Chloe Harris, aka Raica, returning to Endzeit. Her live ambient sets open slowly and wide, just like her delicate album If Not Now, When.","route":false,"why":null,"note":"quiet · live ambient"},{"room":"Sanctuary","a":"Sarah Wreath","sup":"live","tag":null,"s":"2026-09-19T09:30:00Z","e":"2026-09-19T11:00:00Z","sm":1590,"em":1680,"bio":"Talented producer, selector, Berlin community pillar, and dear friend — Sarah returns to Endzeit for her first live set in the Bay. Her debut LP Integration arrived on The Bunker New York; then, a successful second act on Sandwell District.","route":false,"why":null,"note":"quiet · live ambient"},{"room":"Sanctuary","a":"Chuck Gunn","sup":null,"tag":null,"s":"2026-09-19T11:00:00Z","e":"2026-09-19T13:00:00Z","sm":1680,"em":1800,"bio":"Co-founder and resident of QAOTIQ, the queer Bay Area party built around BIPOC and trans artists.","route":false,"why":null,"note":"quiet · live ambient"}],"steps":[{"m":1290,"t":"Arrive","d":"Wristband pickup is off Livingston. Doors 10:00 PM. Walk all three rooms once and find the bars while it is empty."},{"m":1650,"t":"Step outside","d":"No music in the courtyard tonight, so it stays quiet all night. Grab water on the way."},{"m":1800,"t":"It ends","d":"All three rooms stop at 6:00 AM. Sunrise is just before 7:00."}]};
const S = DATA.slots.map(x=>({...x, S:new Date(x.s), E:new Date(x.e)}));
const ROOMS = ['Geist','Sanctuary','Interdimensional Transmissions'];
const ROOMNOTE = {'Geist':'the loud room','Sanctuary':'quiet · live ambient',
 'Interdimensional Transmissions':'darkest and hardest'};
const ini = s => s.replace(/(^|[ (])([A-ZÀ-Ý])/g,(m,a,b)=>a+'<span class="ini">'+b+'</span>');
const fmt = d => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',
   timeZone:'America/Los_Angeles'}).replace(' ','\u2009');
const sup = x => x.sup?'<sup>'+x.sup+'</sup>':'';
let NOW = new Date();

function pad(n){return n<10?'0'+n:''+n}
function dur(ms){const m=Math.max(0,Math.round(ms/60000));
 const h=Math.floor(m/60); return h?h+'h '+pad(m%60)+'m':m+'m';}

function render(){
 NOW = new Date();
 document.getElementById('clock').textContent = fmt(NOW);
 const start = S.reduce((a,b)=>a.S<b.S?a:b).S;
 const end   = S.reduce((a,b)=>a.E>b.E?a:b).E;

 // ---- NOW ----
 let h='';
 if(NOW < start){
   h += '<div class="card now"><div class="eyebrow">Doors in</div>'+
        '<div class="big">'+dur(start-NOW)+'</div>'+
        '<div class="tiny">Wristband pickup is off Livingston. Doors 10:00\u2009PM. '+
        'Walk all three rooms once before it fills up.</div></div>';
   const f=S.filter(x=>x.route).sort((a,b)=>a.S-b.S)[0];
   h += card('First up', f, false);
 } else if(NOW > end){
   h += '<div class="card"><div class="eyebrow">That was Friday</div>'+
        '<div class="big">It\u2019s over</div>'+
        '<div class="tiny">All three rooms stopped at 6:00\u2009AM.</div></div>';
 } else {
   const live = S.filter(x=>x.S<=NOW && NOW<x.E);
   const mine = live.find(x=>x.route) || live[0];
   if(mine) h += card('On now', mine, true);
   const others = live.filter(x=>x!==mine);
   others.forEach(o=>{ h += card('Also on', o, false, true); });
   const nxt = S.filter(x=>x.route && x.S>NOW).sort((a,b)=>a.S-b.S)[0];
   if(nxt) h += card('Next in the plan', nxt, false);
 }
 document.getElementById('v-now').innerHTML = h;

 // ---- PLAN ----
 const plan = S.filter(x=>x.route).map(x=>({k:'set',m:x.sm,x}))
   .concat(DATA.steps.map(s=>({k:'step',m:s.m,s})))
   .sort((a,b)=>a.m-b.m);
 let p='<div class="sec">The plan</div>';
 plan.forEach(it=>{
  if(it.k==='step'){
   p+='<div class="row step"><div class="t">'+minToStr(it.m)+'</div><div class="b">'+
      '<div class="n">'+it.s.t+'</div><div class="w">'+it.s.d+'</div></div></div>';
  } else {
   const x=it.x, st=state(x);
   p+='<div class="row '+st+'" data-i="'+S.indexOf(x)+'"><div class="t">'+fmt(x.S)+'</div>'+
      '<div class="b"><div class="n">'+ini(x.a)+sup(x)+
      (st==='on'?'<span class="pill">now</span>':'')+'</div>'+
      '<div class="r">'+x.room+'</div>'+
      (x.why?'<div class="w">'+x.why+'</div>':'')+'</div></div>';
  }
 });
 document.getElementById('v-plan').innerHTML = p;

 // ---- ALL ROOMS ----
 let a='';
 ROOMS.forEach(rm=>{
  const inR = S.filter(x=>x.room===rm).sort((x,y)=>x.S-y.S);
  if(!inR.length) return;
  const skip = rm==='Interdimensional Transmissions';
  a+='<div class="sec">'+rm+' · '+ROOMNOTE[rm]+'</div>';
  a+='<div class="'+(skip?'dimroom':'')+'">';
  inR.forEach(x=>{
   const st=state(x);
   a+='<div class="row '+st+'" data-i="'+S.indexOf(x)+'"><div class="t">'+fmt(x.S)+'</div>'+
      '<div class="b"><div class="n">'+ini(x.a)+sup(x)+
      (st==='on'?'<span class="pill">now</span>':'')+
      (x.route?'<span class="pill">plan</span>':'')+'</div>'+
      '<div class="r">'+fmt(x.S)+' – '+fmt(x.E)+(x.tag?' · '+x.tag:'')+'</div>'+
      '</div></div>';
  });
  a+='</div>';
 });
 document.getElementById('v-all').innerHTML = a;
}

function minToStr(m){const h=Math.floor(m/60)%24, mm=m%60;
 return (h%12||12)+':'+pad(mm)+'\u2009'+(h<12?'AM':'PM');}
function state(x){ if(NOW>=x.E) return 'past'; if(NOW>=x.S) return 'on'; return ''; }

function card(label, x, hero, small){
 const live = NOW>=x.S && NOW<x.E;
 const pct = live ? Math.min(100,Math.max(0,(NOW-x.S)/(x.E-x.S)*100)) : 0;
 return '<div class="card'+(hero?' now':'')+'" data-i="'+S.indexOf(x)+'">'+
  '<div class="eyebrow">'+label+'</div>'+
  '<div class="name">'+ini(x.a)+sup(x)+'</div>'+
  '<div class="meta">'+x.room+' · '+fmt(x.S)+' – '+fmt(x.E)+'</div>'+
  (live?'<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
        '<div class="left">'+dur(x.E-NOW)+' left</div>':
        '<div class="left">starts in '+dur(x.S-NOW)+'</div>')+
  (x.why&&!small?'<div class="tiny">'+x.why+'</div>':'')+'</div>';
}

document.getElementById('v-info').innerHTML =
 '<div class="sec">Getting in</div>'+
 '<p>Wristband pickup is <b>off Livingston</b>. Doors at 10:00\u2009PM. '+
 'Walk all three rooms once before the music starts and find the two bars and the '+
 'food truck while it is still empty.</p>'+
 '<p><b>The Loom</b> · 2150 Livingston St, Oakland. '+
 '<a href="https://maps.apple.com/?q=2150+Livingston+St,+Oakland,+CA" target="_blank">Open in Maps</a></p>'+
 '<p>21+. Three-day pass only, no single-day tickets.</p>'+
 '<div class="sec">The rooms</div>'+
 '<p><b>Geist</b> — the main room and the loud one. Where we spend most of the night.</p>'+
 '<p><b>Sanctuary</b> — small, off the courtyard, live ambient from midnight to 4:00\u2009AM. '+
 'No beat, low volume. The room to go to if it all gets to be a bit much.</p>'+
 '<p><b>Room D</b> — the Detroit room, in the second building. The hardest and darkest '+
 'of the three. We are skipping it tonight.</p>'+
 '<p><b>Courtyard</b> — outdoors. Nothing is programmed in it on Friday, so it stays '+
 'quiet and open all night. Bars are indoors; there is a food truck out here.</p>'+
 '<div class="sec">When it ends</div>'+
 '<p>All three rooms stop at <b>6:00\u2009AM</b>. Sunrise is just before 7:00. '+
 'Sort out the ride home before the night starts, not at 6:00\u2009AM.</p>'+
 '<div class="install" id="inst">To keep this on your home screen: tap the '+
 '<b>Share</b> button, then <b>Add to Home Screen</b>.</div>'+
 '<p class="src" style="font-size:11.5px;color:var(--dim);margin-top:18px">'+
 'Set times and biographies from endzeit.us/entanglement. The plan is ours.</p>';

// tap through to a biography
document.body.addEventListener('click',e=>{
 const r = e.target.closest('[data-i]');
 if(r){ const x = S[+r.dataset.i];
  document.getElementById('sh-n').innerHTML = ini(x.a)+sup(x);
  document.getElementById('sh-m').textContent =
    x.room+' · '+fmt(x.S)+' – '+fmt(x.E)+(x.tag?' · '+x.tag:'');
  document.getElementById('sh-b').textContent = x.bio;
  document.getElementById('sheet').classList.add('open'); return; }
 if(e.target.closest('.sheetin')) return;
 document.getElementById('sheet').classList.remove('open');
});

document.querySelectorAll('nav button').forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  ['now','plan','all','info'].forEach(v=>
    document.getElementById('v-'+v).classList.toggle('hide', v!==b.dataset.v));
  window.scrollTo(0,0);
 };
});

render(); setInterval(render, 20000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
