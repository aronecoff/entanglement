<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Entanglement 2026</title>
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Entanglement Festival — 18–20 September 2026, The Loom, Oakland. Times, artists and a route through the weekend.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entanglement">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#0a0a0b; --s1:#141416; --s2:#1c1c1f; --line:rgba(245,245,247,.10);
  --fg:#f5f5f7; --dim:#8e8e93; --dim2:#636366;
  --ease:cubic-bezier(.22,1,.36,1);
  --pad:20px;
}
@media (prefers-color-scheme: light){ :root{ } }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg);overscroll-behavior:none}
body{
  font:400 17px/1.47 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
  min-height:100dvh;
}
.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}
.wrap{max-width:600px;margin:0 auto;padding:0 var(--pad)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(10,10,11,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;transition:border-color .3s}
.top.stuck{border-bottom-color:var(--line)}
.topin{max-width:600px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;
  display:flex;align-items:center;gap:12px}
.mark{font-size:19px;font-weight:500;letter-spacing:-.02em;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark .f{font-family:Georgia,serif;font-size:10px;vertical-align:super;color:var(--dim2);margin-left:4px}
.clock{font-size:14px;color:var(--dim);letter-spacing:.01em;font-variant-numeric:tabular-nums}

/* ---------- hero ---------- */
.hero{padding:26px 0 8px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#30d158;
  box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(48,209,88,.5)}70%{box-shadow:0 0 0 11px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
.hname{font-size:clamp(40px,12vw,58px);line-height:1.02;letter-spacing:-.035em;font-weight:600}
.hname sup{font-size:.26em;font-weight:400;color:var(--dim);vertical-align:super;margin-left:.22em;
  letter-spacing:.04em}
.hmeta{font-size:17px;color:var(--dim);margin-top:12px}
.hbig{font-size:clamp(46px,15vw,72px);line-height:1;letter-spacing:-.045em;font-weight:600;
  font-variant-numeric:tabular-nums}
.prog{margin-top:22px}
.track{height:4px;border-radius:99px;background:rgba(245,245,247,.14);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--fg);
  transition:width 1s linear}
.plabel{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:9px}

/* ---------- cards ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;
  margin-top:12px;position:relative;overflow:hidden;
  transition:transform .32s var(--ease),background .2s}
.card.tap:active{transform:scale(.975);background:var(--s2)}
.ctitle{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px}
.cname{font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1.14}
.cname sup{font-size:.4em;font-weight:400;color:var(--dim);vertical-align:super;margin-left:.2em}
.cmeta{font-size:15px;color:var(--dim);margin-top:6px}
.cwhy{font-size:16px;color:var(--fg);opacity:.78;margin-top:12px;line-height:1.46}
.chev{position:absolute;right:18px;top:50%;transform:translateY(-50%);opacity:.3}

/* ---------- section + rows ---------- */
.sec{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  margin:34px 0 4px;padding-bottom:10px}
.sec span{color:var(--dim2);font-weight:400;letter-spacing:.06em;text-transform:none;font-size:13px}
.list{background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.row{display:flex;gap:14px;padding:16px 18px;align-items:flex-start;position:relative;
  transition:background .18s}
.row+.row{border-top:1px solid var(--line)}
.row.tap:active{background:var(--s2)}
.row .t{flex:0 0 78px;font-size:14px;color:var(--dim);padding-top:3px}
.row .b{flex:1;min-width:0}
.row .n{font-size:20px;font-weight:500;letter-spacing:-.02em;line-height:1.22;
  display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.row .n .nm{display:inline}
.row .n sup{font-size:11px;font-weight:400;color:var(--dim);vertical-align:super}
.row .r{font-size:14px;color:var(--dim);margin-top:4px}
.row .w{font-size:15px;opacity:.72;margin-top:9px;line-height:1.45}
.row.past{opacity:.34}
.row.live{background:rgba(48,209,88,.06)}
.row.live::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#30d158}
.row.step .n{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;background:rgba(245,245,247,.12);color:var(--fg)}
.tag.live{background:#30d158;color:#04160a}
.tag.plan{background:rgba(245,245,247,.14)}
.muted{opacity:.44}

/* ---------- info ---------- */
.ib{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:12px}
.ib h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.ib p{font-size:16px;line-height:1.5;color:var(--dim);margin-top:9px}
.ib p b{color:var(--fg);font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:var(--fg);color:#0a0a0b;border:0;border-radius:15px;padding:16px;
  font:600 17px/1 inherit;letter-spacing:-.01em;margin-top:14px;cursor:pointer;
  transition:transform .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
  padding:0 var(--pad) calc(14px + env(safe-area-inset-bottom));pointer-events:none}
.navin{pointer-events:auto;display:flex;position:relative;background:rgba(28,28,31,.8);
  backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border:1px solid var(--line);border-radius:999px;padding:5px;max-width:420px;width:100%;
  box-shadow:0 10px 34px rgba(0,0,0,.45)}
.navin i.pill{position:absolute;top:5px;bottom:5px;left:5px;border-radius:999px;
  background:rgba(245,245,247,.13);transition:transform .42s var(--ease),width .42s var(--ease)}
nav button{position:relative;flex:1;background:none;border:0;color:var(--dim);
  font:500 13px/1 inherit;letter-spacing:-.01em;padding:13px 0;cursor:pointer;
  transition:color .3s var(--ease);min-height:46px}
nav button.on{color:var(--fg)}

/* ---------- facts / chips / listen ---------- */
.facts{display:flex;flex-direction:column;gap:0;margin-top:18px;
  border-top:1px solid var(--line)}
.fact{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);
  align-items:baseline}
.fact dt{flex:0 0 96px;font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim2)}
.fact dd{flex:1;font-size:16px;line-height:1.4}
.listen{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.lbtn{flex:1 1 0;min-width:96px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 10px;
  color:var(--fg);font:600 14px/1 inherit;cursor:pointer;
  transition:transform .28s var(--ease),background .2s}
.lbtn:active{transform:scale(.95);background:#242428}
.lbtn svg{opacity:.85}
.starbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:transparent;border:1px solid var(--line);border-radius:15px;padding:15px;
  color:var(--fg);font:600 16px/1 inherit;margin-top:11px;cursor:pointer;
  transition:transform .28s var(--ease),background .2s,border-color .2s}
.starbtn:active{transform:scale(.97)}
.starbtn.on{background:rgba(255,214,10,.14);border-color:rgba(255,214,10,.5);color:#ffd60a}
.star{position:absolute;right:16px;top:14px;width:34px;height:34px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;border:0;background:transparent;
  color:var(--dim2);cursor:pointer;transition:transform .3s var(--ease),color .2s}
.star:active{transform:scale(.8)}
.star.on{color:#ffd60a}
.row{padding-right:52px}
.sheetnav{display:flex;gap:9px;margin-top:20px}
.sheetnav button{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:14px;
  padding:13px;color:var(--fg);font:600 14px/1 inherit;cursor:pointer;
  transition:transform .28s var(--ease),opacity .2s}
.sheetnav button:active{transform:scale(.96)}
.sheetnav button:disabled{opacity:.3}

/* ---------- day switcher ---------- */
.days{display:flex;gap:6px;background:var(--s1);border:1px solid var(--line);
  border-radius:999px;padding:5px;margin:4px 0 14px;position:relative}
.days button{flex:1;background:none;border:0;color:var(--dim);font:600 14px/1 inherit;
  padding:12px 0;border-radius:999px;cursor:pointer;letter-spacing:-.01em;
  transition:color .3s var(--ease),background .3s var(--ease)}
.days button.on{color:#0a0a0b;background:var(--fg)}
.days button:active{transform:scale(.97)}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;color:var(--fg);font:400 16px/1 inherit;margin:4px 0 14px;
  -webkit-appearance:none}
.search::placeholder{color:var(--dim2)}
.search:focus{outline:none;border-color:rgba(245,245,247,.34)}
.az{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);margin:22px 0 8px;padding-left:2px}

/* ---------- filter chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 0 6px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-radius:999px;
  padding:9px 15px;color:var(--dim);font:600 13.5px/1 inherit;cursor:pointer;white-space:nowrap;
  transition:transform .26s var(--ease),background .2s,color .2s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--fg);color:#0a0a0b;border-color:var(--fg)}
.empty{padding:34px 4px;color:var(--dim);font-size:16px;text-align:center}

/* ---------- mini now bar ---------- */
.mini{position:fixed;left:0;right:0;z-index:55;display:flex;justify-content:center;
  bottom:calc(76px + env(safe-area-inset-bottom));padding:0 var(--pad);pointer-events:none;
  opacity:0;transform:translateY(10px);transition:opacity .38s var(--ease),transform .38s var(--ease)}
.mini.on{opacity:1;transform:none}
.miniin{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:420px;
  background:rgba(28,28,31,.9);backdrop-filter:saturate(180%) blur(22px);
  -webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--line);
  border-radius:17px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;
  transition:transform .28s var(--ease)}
.miniin:active{transform:scale(.98)}
.mdot{width:7px;height:7px;border-radius:50%;background:#30d158;flex:0 0 auto;
  animation:pulse 2.4s var(--ease) infinite}
.mtxt{flex:1;min-width:0}
.mn{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mr{font-size:12.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mleft{font-size:12.5px;color:var(--dim);flex:0 0 auto}

/* ---------- install sheet ---------- */
.isheet{position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--s2);
  border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--line);
  padding:26px var(--pad) calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .5s var(--ease);
  box-shadow:0 -18px 50px rgba(0,0,0,.6)}
.isheet.on{transform:translateY(0)}
.ihead{display:flex;align-items:center;gap:14px}
.iicon{width:60px;height:60px;border-radius:15px;flex:0 0 auto;
  box-shadow:0 5px 16px rgba(0,0,0,.45)}
.in1{font-size:19px;font-weight:600;letter-spacing:-.02em}
.in2{font-size:15px;color:var(--dim);margin-top:3px}
.ip{font-size:16px;line-height:1.5;color:var(--dim);margin-top:16px}
.ip b{color:var(--fg);font-weight:600}
.isheet .btn{margin-top:14px}
.isheet .btn.ghost{margin-top:9px;font-weight:500;color:var(--dim)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;
  transition:opacity .34s var(--ease);z-index:90;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--s2);
  border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .44s var(--ease);
  max-height:88dvh;display:flex;flex-direction:column;will-change:transform}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{padding:11px 0 4px;display:flex;justify-content:center;flex:0 0 auto;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:99px;background:rgba(245,245,247,.26)}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch;
  padding:8px var(--pad) calc(30px + env(safe-area-inset-bottom))}
.sbody h2{font-size:32px;font-weight:600;letter-spacing:-.032em;line-height:1.08}
.sbody h2 sup{font-size:.34em;font-weight:400;color:var(--dim);vertical-align:super;margin-left:.2em}
.sm{font-size:15px;color:var(--dim);margin-top:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sbody p.bio{font-size:17px;line-height:1.52;margin-top:16px}
.src{font-size:13px;color:var(--dim2);margin-top:20px}

/* ---------- motion ---------- */
.rev{opacity:0;transform:translateY(14px)}
.rev.in{opacity:1;transform:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
.view{display:none}
.view.on{display:block;animation:fade .34s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.jump{position:fixed;right:var(--pad);bottom:calc(88px + env(safe-area-inset-bottom));z-index:55;
  background:rgba(28,28,31,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:11px 16px;
  font:600 13px/1 inherit;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease);transform:translateY(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.jump.on{opacity:1;pointer-events:auto;transform:none}
.jump:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .rev{opacity:1;transform:none}
}
</style></head><body>

<div class="top" id="top"><div class="topin">
  <div class="mark"><span class="serif">E</span>ntanglement<span class="f">(Festival)</span></div>
  <div class="clock" id="clock"></div>
</div></div>

<main class="wrap">
  <section class="view on" id="v-now"></section>
  <section class="view" id="v-plan">
    <div class="days" id="days-plan"></div>
    <div id="planbody"></div>
  </section>
  <section class="view" id="v-all">
    <div class="days" id="days-all"></div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">Everything</button>
      <button class="chip" data-f="plan">In the plan</button>
      <button class="chip" data-f="star">Starred</button>
      <button class="chip" data-f="live">Live acts</button>
      <button class="chip" data-f="on">On now</button>
    </div>
    <div id="allbody"></div>
  </section>
  <section class="view" id="v-art">
    <input id="q" class="search" type="search" placeholder="Search artists, rooms, labels"
      autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="artbody"></div>
  </section>
  <section class="view" id="v-info"></section>
</main>

<button class="jump" id="jump">Jump to now</button>

<div class="mini" id="mini"><div class="miniin" id="miniin">
  <i class="mdot"></i>
  <div class="mtxt"><div class="mn" id="mn"></div><div class="mr" id="mr"></div></div>
  <div class="mleft" id="mleft"></div>
</div></div>

<nav><div class="navin" id="navin">
  <i class="pill" id="pill"></i>
  <button data-v="now" class="on">Now</button>
  <button data-v="plan">Plan</button>
  <button data-v="all">Rooms</button>
  <button data-v="art">Artists</button>
  <button data-v="info">Info</button>
</div></nav>

<div class="scrim" id="iscrim"></div>
<div class="isheet" id="isheet">
  <div class="ihead">
    <img src="./icon-192.png" alt="" class="iicon">
    <div class="itext">
      <div class="in1">Entanglement 2026</div>
      <div class="in2">Add it to your home screen</div>
    </div>
  </div>
  <p class="ip" id="ip">One tap and it lives on your phone like any other app —
     opens full screen, and keeps working if the signal drops.</p>
  <button class="btn" id="iyes">Install</button>
  <button class="btn ghost" id="ino">Not now</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="sbody">
    <h2 id="sh-n"></h2>
    <div class="sm" id="sh-m"></div>
    <p class="bio" id="sh-b"></p>
    <dl class="facts" id="sh-f"></dl>
    <div class="listen" id="sh-l"></div>
    <button class="starbtn" id="sh-star"></button>
    <div class="sheetnav">
      <button id="sh-prev">← Earlier</button>
      <button id="sh-next">Later →</button>
    </div>
    <div class="src">Biography and facts as published by the festival.
      Listen links are searches.</div>
  </div>

<script>

function heroNow(){
  const start = S.reduce((a,b)=>a.S<b.S?a:b).S, end = S.reduce((a,b)=>a.E>b.E?a:b).E;
  if (NOW < start) return `<div class="hero rev">
      <div class="kicker">The weekend starts in</div>
      <div class="hbig">${dur(start-NOW)}</div>
      <div class="hmeta">Friday 18 \u2013 Sunday 20 September \u00b7 The Loom, Oakland</div></div>`;
  if (NOW > end) return `<div class="hero rev">
      <div class="kicker">That was Entanglement</div>
      <div class="hname">It\u2019s over</div>
      <div class="hmeta">Three days, four rooms, thirty-odd artists.</div></div>`;
  const live = S.filter(x => x.S<=NOW && NOW<x.E);
  const hero = live.find(x=>x.route) || live[0];
  if (!hero){
    const n = S.filter(x=>x.S>NOW).sort((a,b)=>a.S-b.S)[0];
    return n ? `<div class="hero rev" data-i="${S.indexOf(n)}">
      <div class="kicker">Next up \u00b7 ${esc(dayName(n.d))}</div>
      <div class="hbig">${dur(n.S-NOW)}</div>
      <div class="hmeta">until ${ini(n.a)} in ${esc(n.room)}</div></div>` : '';
  }
  const pct = (NOW-hero.S)/(hero.E-hero.S)*100;
  return `<div class="hero rev" data-i="${S.indexOf(hero)}">
    <div class="kicker"><i class="dot"></i> On now \u00b7 ${esc(hero.room)} \u00b7 ${esc(dayName(hero.d))}</div>
    <div class="hname">${ini(hero.a)}${sup(hero)}</div>
    <div class="hmeta">${fmt(hero.S)} \u2013 ${fmt(hero.E)}</div>
    <div class="prog"><div class="track"><i style="width:${pct.toFixed(2)}%"></i></div>
      <div class="plabel"><span>${dur(NOW-hero.S)} in</span><span>${dur(hero.E-NOW)} left</span></div>
    </div></div>`;
}


function card(label, x, why, hideRoom){
  const live = NOW>=x.S && NOW<x.E;
  return `<div class="card tap rev" data-i="${S.indexOf(x)}">
    <div class="ctitle">${esc(label)}</div>
    <div class="cname">${ini(x.a)}${sup(x)}</div>
    <div class="cmeta">${hideRoom?'':esc(x.room)+' · '}${fmt(x.S)} – ${fmt(x.E)}${
      live ? ' · '+dur(x.E-NOW)+' left' : ' · in '+dur(x.S-NOW)}</div>
    ${why && x.why ? `<div class="cwhy">${esc(x.why)}</div>` : ''}
    <svg class="chev" width="9" height="15" viewBox="0 0 9 15" fill="none"><path d="M1.5 1.5 7 7.5 1.5 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </div>`;
}

function renderNow(){
  let h = heroNow();
  const start = S.reduce((a,b)=>a.S<b.S?a:b).S;
  const live = S.filter(x => x.S<=NOW && NOW<x.E);
  const hero = live.find(x=>x.route) || live[0];
  const nxt = S.filter(x => x.route && x.S>NOW).sort((a,b)=>a.S-b.S)[0];
  if (nxt) h += `<div class="sec">${NOW < start ? 'First up' : 'Next in the plan'}</div>`
              + card(NOW < start ? 'Opens the night' : 'Up next', nxt, true);
  const others = live.filter(x => x!==hero);
  if (others.length){
    h += `<div class="sec">Also playing right now</div>`;
    others.forEach(o => h += card(o.room==='Interdimensional Transmissions'?'Room D':o.room, o, false, true));
  }
  $('#v-now').innerHTML = h;
}

function renderDayBar(){
  const bar = DAYS.map(d =>
    `<button data-day="${d.id}" class="${d.id===DAY?'on':''}">${esc(d.tab)}</button>`).join('');
  $('#days-plan').innerHTML = bar; $('#days-all').innerHTML = bar;
}
function todayId(){ const d = DAYS.find(d => NOW >= d.S && NOW < d.E); return d ? d.id : null; }

function minStr(m){ const h = Math.floor(m/60)%24;
  return (h%12||12)+':'+pad(m%60)+' '+(h<12?'AM':'PM'); }

function renderPlan(){
  const sets = S.filter(x=>x.route && x.d===DAY);
  const items = sets.map(x=>({k:'set',m:x.sm,x}))
    .concat((DATA.steps[DAY]||[]).map(s=>({k:'step',m:s.m,s}))).sort((a,b)=>a.m-b.m);
  const rooms = [...new Set(sets.map(x=>x.room))].length;
  let h = `<div class="sec">The plan <span>\u00b7 ${sets.length} sets, ${rooms} room${rooms>1?'s':''}</span></div><div class="list">`;
  items.forEach(it => {
    if (it.k === 'step'){
      h += `<div class="row step"><div class="t">${minStr(it.m)}</div><div class="b">
        <div class="n">${esc(it.s.t)}</div><div class="w">${esc(it.s.d)}</div></div></div>`;
    } else {
      const x = it.x, st = state(x);
      h += `<div class="row tap ${st}" data-i="${S.indexOf(x)}" ${st==='live'?'data-now="1"':''}>
        <div class="t">${fmt(x.S)}</div><div class="b">
        <div class="n"><span class="nm">${ini(x.a)}${sup(x)}</span>${st==='live'?'<span class="tag live">Now</span>':''}</div>
        <div class="r">${esc(x.room)} · ${fmt(x.S)} – ${fmt(x.E)}</div>
        ${x.why?`<div class="w">${esc(x.why)}</div>`:''}</div></div>`;
    }
  });
  $('#planbody').innerHTML = h + '</div>';
}

let Q = '';
function renderArtists(){
  const seen = new Map();
  S.filter(x=>!x.talk).forEach(x => { if(!seen.has(x.a)) seen.set(x.a, []); seen.get(x.a).push(x); });
  const q = Q.trim().toLowerCase();
  const names = [...seen.keys()].filter(a => {
    if (!q) return true;
    const sets = seen.get(a);
    const hay = (a + ' ' + sets[0].bio + ' ' + sets.map(s=>s.room+' '+dayName(s.d)).join(' ') +
      ' ' + (sets[0].facts||[]).map(f=>f[1]).join(' ')).toLowerCase();
    return hay.includes(q);
  }).sort((a,b) => a.replace(/^DJ /i,'').localeCompare(b.replace(/^DJ /i,'')));
  if (!names.length){ $('#artbody').innerHTML =
    `<div class="empty">Nobody matches \u201c${esc(Q)}\u201d.</div>`; return; }
  let h = `<div class="sec">${names.length} artist${names.length>1?'s':''}</div><div class="list">`;
  names.forEach(a => {
    const sets = seen.get(a).sort((x,y)=>x.S-y.S), f = sets[0];
    const when = sets.map(x => dayName(x.d)+' '+fmt(x.S)).join(' \u00b7 ');
    const st = sets.some(x=>state(x)==='live') ? 'live' : (sets.every(x=>state(x)==='past') ? 'past' : '');
    h += `<div class="row tap ${st}" data-i="${S.indexOf(f)}">
      <div class="b"><div class="n"><span class="nm">${ini(a)}${sup(f)}</span>
        ${st==='live'?'<span class="tag live">Now</span>':''}
        ${sets.some(x=>x.route)?'<span class="tag plan">Plan</span>':''}</div>
      <div class="r">${esc(when)} \u00b7 ${esc(sets.map(x=>x.room).filter((v,i,z)=>z.indexOf(v)===i).join(', '))}</div></div>
      <button class="star ${starred(f)?'on':''}" data-star="${S.indexOf(f)}" aria-label="Star">${SVG_STAR(starred(f))}</button></div>`;
  });
  $('#artbody').innerHTML = h + '</div>';
}

let FILTER = 'all';
const passes = x => FILTER==='all' || (FILTER==='plan'&&x.route) ||
  (FILTER==='star'&&starred(x)) || (FILTER==='live'&&x.sup) ||
  (FILTER==='on'&&state(x)==='live');

function renderAll(){
  let h = '', shown = 0;
  ROOMS.forEach(rm => {
    const inR = S.filter(x=>x.room===rm && x.d===DAY && passes(x)).sort((a,b)=>a.S-b.S);
    if (!inR.length) return;
    shown += inR.length;
    const skip = rm === 'Interdimensional Transmissions';
    h += `<div class="sec">${esc(rm==='Interdimensional Transmissions'?'Room D':rm)} <span>· ${NOTE[rm]}</span></div>
      <div class="list ${skip?'muted':''}">`;
    inR.forEach(x => {
      const st = state(x);
      h += `<div class="row tap ${st}" data-i="${S.indexOf(x)}" ${st==='live'?'data-now="1"':''}>
        <div class="t">${fmt(x.S)}</div><div class="b">
        <div class="n"><span class="nm">${ini(x.a)}${sup(x)}</span>${st==='live'?'<span class="tag live">Now</span>':''}${x.route?'<span class="tag plan">Plan</span>':''}</div>
        <div class="r">${fmt(x.S)} – ${fmt(x.E)}${x.tag?' · '+esc(x.tag):''}</div></div>
        <button class="star ${starred(x)?'on':''}" data-star="${S.indexOf(x)}"
          aria-label="Star">${SVG_STAR(starred(x))}</button></div>`;
    });
    h += '</div>';
  });
  if (!shown) h = `<div class="empty">Nothing here yet.<br>Star a set and it shows up.</div>`;
  $('#allbody').innerHTML = h;
}

 const talks = S.filter(x=>x.talk).sort((a,b)=>a.S-b.S).map(x =>

 $('#maps').onclick = () => { buzz(8);

/* ---------------- install (Android Chrome) ---------------- */
let deferred = null;
const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isheet = () => $('#isheet'), iscrim = () => $('#iscrim');
function dismissed(){ try{ return localStorage.getItem('inst-no') === '1'; }catch(e){ return false; } }
function showInstallSheet(){
  if (standalone() || dismissed()) return;
  if (!deferred && !iOS) return;                 // no prompt available and not iOS: skip
  if (iOS && !deferred){
    $('#ip').innerHTML = 'Tap the <b>Share</b> button at the bottom of Safari, '+
      'then <b>Add to Home Screen</b>. It opens full screen and keeps working offline.';
    $('#iyes').style.display = 'none';
    $('#ino').textContent = 'Got it';
  }
  isheet().classList.add('on'); iscrim().classList.add('on'); buzz(10);
}
function hideInstallSheet(remember){
  isheet().classList.remove('on'); iscrim().classList.remove('on');
  if (remember){ try{ localStorage.setItem('inst-no','1'); }catch(e){} }
}
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferred = e; wireInstall();
  setTimeout(showInstallSheet, 600);
});
addEventListener('appinstalled', () => { deferred = null; hideInstallSheet(false); wireInstall(); });
addEventListener('DOMContentLoaded', () => {
  $('#iyes').onclick = async () => {
    buzz(12);
    if (!deferred){ hideInstallSheet(false); go('info'); return; }
    hideInstallSheet(false);
    deferred.prompt();
    const r = await deferred.userChoice;
    if (r.outcome === 'accepted') deferred = null;
    wireInstall();
  };
  $('#ino').onclick = () => { buzz(6); hideInstallSheet(true); };
  iscrim().onclick = () => hideInstallSheet(true);
  // iOS has no prompt event, so offer the instructions on first run
  if (iOS) setTimeout(showInstallSheet, 1400);
});
function standalone(){ return matchMedia('(display-mode: standalone)').matches ||
  navigator.standalone === true; }
function wireInstall(){
  const box = $('#installbox'); if (!box) return;
  const btn = $('#install'), txt = $('#instxt');
  if (standalone()){ box.style.display = 'none'; return; }
  box.style.display = '';
  if (deferred){
    btn.style.display = ''; btn.textContent = 'Install app';
    btn.onclick = async () => { buzz(10); deferred.prompt();
      const r = await deferred.userChoice; if (r.outcome === 'accepted') deferred = null; wireInstall(); };
  } else {
    btn.style.display = 'none';
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    txt.innerHTML = iOS
      ? 'Tap the <b>Share</b> button at the bottom of Safari, then <b>Add to Home Screen</b>.'
      : 'Open the <b>⋮</b> menu at the top right of Chrome, then tap <b>Add to Home screen</b>. It opens like an app and keeps working if the signal drops.';
  }
}

/* ---------------- shell ---------------- */
let view = 'now';
const VIEWS = ['now','plan','all','art','info'];
function movePill(){
  const btns = [...document.querySelectorAll('nav button')];
  const b = btns[VIEWS.indexOf(view)], p = $('#pill');
  p.style.width = b.offsetWidth+'px';
  p.style.transform = 'translateX('+(b.offsetLeft-5)+'px)';
}
function go(v, silent){
  if (v === view) return;
  view = v;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v===v));
  VIEWS.forEach(x => $('#v-'+x).classList.toggle('on', x===v));
  movePill(); if (!silent) buzz(6);
  scrollTo({top:0,behavior:'instant'});
  reveal(); updateJump(); renderMini();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.v));
addEventListener('DOMContentLoaded', () => {
  const qi = $('#q');
  if (qi) qi.addEventListener('input', () => { Q = qi.value; renderArtists(); });
});

/* swipe between views */
let tx=0, ty=0, tracking=false;
addEventListener('touchstart', e => { if(e.touches.length!==1) return;
  tx = e.touches[0].clientX; ty = e.touches[0].clientY; tracking = true; }, {passive:true});
addEventListener('touchend', e => {
  if (!tracking) return; tracking = false;
  if ($('#sheet').classList.contains('on')) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 62 && Math.abs(dx) > Math.abs(dy)*1.7){
    const i = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1);
    if (i >= 0 && i < VIEWS.length) go(VIEWS[i]);
  }
}, {passive:true});

/* scroll reveal + sticky header */
let io;
function reveal(){
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
  }), {rootMargin:'0px 0px -6% 0px'});
  const els = [...document.querySelectorAll('.view.on .rev')];
  els.forEach((el,i) => { el.style.transitionDelay = Math.min(i*45,220)+'ms'; io.observe(el); });
  setTimeout(() => els.forEach(el => el.classList.add('in')), 700);
}
addEventListener('scroll', () => {
  $('#top').classList.toggle('stuck', scrollY > 4);
  updateJump();
}, {passive:true});

function renderMini(){
  const live = S.filter(x => x.S<=NOW && NOW<x.E);
  const x = live.find(y=>y.route) || live[0];
  const m = $('#mini');
  if (!x || view === 'now'){ m.classList.remove('on'); return; }
  $('#mn').innerHTML = ini(x.a) + sup(x);
  $('#mr').textContent = x.room;
  $('#mleft').textContent = dur(x.E - NOW) + ' left';
  $('#miniin').dataset.i = S.indexOf(x);
  m.classList.add('on');
}

function updateJump(){
  const el = document.querySelector('.view.on [data-now]');
  const j = $('#jump');
  if (!el || view==='now' || view==='info'){ j.classList.remove('on'); return; }
  const r = el.getBoundingClientRect();
  j.classList.toggle('on', r.bottom < 70 || r.top > innerHeight - 90);
}
$('#jump').onclick = () => { buzz(6);
  const el = document.querySelector('.view.on [data-now]');
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); };

/* ---------------- sheet ---------------- */
const sheet = $('#sheet'), scrim = $('#scrim');
let sheetIdx = -1;
const ORDER = S.map((x,i)=>i).sort((a,b)=> S[a].S - S[b].S || S[a].room.localeCompare(S[b].room));
const SVG_PLAY = `<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.6v10.8L13 8z"/></svg>`;

function paintSheet(x){
  if (x.talk){
    $('#sh-n').innerHTML = ini(x.a);
    $('#sh-m').textContent = dayName(x.d)+' \u00b7 '+x.room+' \u00b7 '+fmt(x.S)+' \u2013 '+fmt(x.E);
    $('#sh-b').textContent = x.speakers ? 'With '+x.speakers+'.' : '';
    $('#sh-f').innerHTML = ''; $('#sh-l').innerHTML = '';
    const sb0 = $('#sh-star');
    sb0.className = 'starbtn' + (starred(x) ? ' on' : '');
    sb0.innerHTML = SVG_STAR(starred(x)) + (starred(x) ? ' Starred' : ' Star this talk');
    sb0.onclick = () => toggleStar(x);
    const p0 = ORDER.indexOf(S.indexOf(x));
    $('#sh-prev').disabled = p0<=0; $('#sh-next').disabled = p0>=ORDER.length-1;
    $('#sh-prev').onclick = () => { if(p0>0){ buzz(6); openSheet(S[ORDER[p0-1]], true); } };
    $('#sh-next').onclick = () => { if(p0<ORDER.length-1){ buzz(6); openSheet(S[ORDER[p0+1]], true); } };
    return;
  }
  const mins = Math.round((x.E - x.S)/60000);
  $('#sh-n').innerHTML = ini(x.a)+sup(x);
  $('#sh-m').textContent = dayName(x.d) + ' · ' + x.room + ' · ' + fmt(x.S) + ' – ' + fmt(x.E) +
    ' · ' + (mins>=60 ? Math.floor(mins/60)+'h'+(mins%60?' '+(mins%60)+'m':'') : mins+'m') +
    (x.tag ? ' · ' + x.tag : '');
  $('#sh-b').textContent = x.bio;
  $('#sh-f').innerHTML = (x.facts||[]).map(f =>
    `<div class="fact"><dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd></div>`).join('');
  const q = encodeURIComponent(x.a + ' dj set');
  const qa = encodeURIComponent(x.a);
  $('#sh-l').innerHTML =
    `<button class="lbtn" data-open="https://www.youtube.com/results?search_query=${q}">${SVG_PLAY} YouTube</button>` +
    `<button class="lbtn" data-open="https://open.spotify.com/search/${qa}">${SVG_PLAY} Spotify</button>` +
    `<button class="lbtn" data-open="https://soundcloud.com/search?q=${qa}">${SVG_PLAY} SoundCloud</button>`;
  const sb = $('#sh-star');
  sb.className = 'starbtn' + (starred(x) ? ' on' : '');
  sb.innerHTML = SVG_STAR(starred(x)) + (starred(x) ? ' Starred' : ' Star this set');
  sb.onclick = () => toggleStar(x);
  const pos = ORDER.indexOf(S.indexOf(x));
  $('#sh-prev').disabled = pos <= 0;
  $('#sh-next').disabled = pos >= ORDER.length-1;
  $('#sh-prev').onclick = () => { if(pos>0){ buzz(6); openSheet(S[ORDER[pos-1]], true); } };
  $('#sh-next').onclick = () => { if(pos<ORDER.length-1){ buzz(6); openSheet(S[ORDER[pos+1]], true); } };
}

function openSheet(x, keep){
  if (!keep) buzz(9);
  sheetIdx = S.indexOf(x);
  paintSheet(x);
  sheet.querySelector('.sbody').scrollTop = 0;
  sheet.classList.add('on'); scrim.classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  sheet.classList.remove('on','drag'); sheet.style.transform = '';
  scrim.classList.remove('on'); document.body.style.overflow = ''; sheetIdx = -1;
}
scrim.onclick = closeSheet;
document.body.addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st){ e.stopPropagation(); toggleStar(S[+st.dataset.star]); return; }
  const op = e.target.closest('[data-open]');
  if (op){ buzz(8); window.open(op.dataset.open, '_blank', 'noopener'); return; }
  const db = e.target.closest('[data-day]');
  if (db){ buzz(6); DAY = db.dataset.day; renderDayBar(); renderPlan(); renderAll();
    reveal(); updateJump(); return; }
  const ch = e.target.closest('.chip');
  if (ch){ buzz(6); FILTER = ch.dataset.f;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c===ch));
    renderAll(); reveal(); return; }
  const t = e.target.closest('[data-i]');
  if (t && !sheet.contains(t)) openSheet(S[+t.dataset.i]);
});

/* swipe inside the sheet moves between sets */
let sx2 = 0, sy2 = 0;
sheet.addEventListener('touchstart', e => {
  sx2 = e.touches[0].clientX; sy2 = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx2, dy = e.changedTouches[0].clientY - sy2;
  if (Math.abs(dx) > 68 && Math.abs(dx) > Math.abs(dy)*1.8 && sheetIdx >= 0){
    const pos = ORDER.indexOf(sheetIdx), n = pos + (dx < 0 ? 1 : -1);
    if (n >= 0 && n < ORDER.length){ buzz(6); openSheet(S[ORDER[n]], true); }
  }
}, {passive:true});

/* drag the sheet down to dismiss */
let sy = 0, dragging = false;
const grab = $('#grab');
grab.addEventListener('touchstart', e => {
  sy = e.touches[0].clientY; dragging = true; sheet.classList.add('drag');
}, {passive:true});
grab.addEventListener('touchmove', e => {
  if (!dragging) return;
  const d = Math.max(0, e.touches[0].clientY - sy);
  sheet.style.transform = 'translateY('+d+'px)';
}, {passive:true});
grab.addEventListener('touchend', e => {
  if (!dragging) return; dragging = false; sheet.classList.remove('drag');
  const d = Math.max(0, e.changedTouches[0].clientY - sy);
  if (d > 110) closeSheet(); else sheet.style.transform = '';
}, {passive:true});

/* ---------------- tick ---------------- */
function tick(){
  NOW = new Date();
  $('#clock').textContent = fmt(NOW);
  renderDayBar(); renderNow(); renderPlan(); renderAll(); renderArtists(); renderMini();
  reveal(); movePill(); updateJump();
}
renderInfo();
DAY = todayId() || (NOW > DAYS[2].E ? 'sun' : 'fri');
tick();
setInterval(() => {
  NOW = new Date(); $('#clock').textContent = fmt(NOW);
  renderNow(); renderPlan(); renderAll(); renderArtists(); renderMini(); reveal(); updateJump();
}, 30000);
addEventListener('resize', movePill);
addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

const q = new URLSearchParams(location.search).get('v');
if (q && VIEWS.includes(q)) go(q, true);
if ('serviceWorker' in navigator) addEventListener('load', () =>
  navigator.serviceWorker.register('./sw.js').catch(()=>{}));
